
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  adminpage:
    build: ./adminpage
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: always
